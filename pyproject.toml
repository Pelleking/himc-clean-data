[project]
name = "himc-mcp"
version = "0.1.2"
description = "MCP server for the cleaned HIMC data room (fictional hospital data for the Hyper Island Intelligent Machines module)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.scripts]
himc-mcp = "himc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/himc_mcp"]
